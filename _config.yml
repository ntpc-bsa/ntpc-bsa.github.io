title: 新北市雙語策略聯盟
description: NEW TAIPEI CITY BILINGUAL STRATEGIC ALLIANCE
baseurl: ""
url: "https://ntpc-bsa.pages.dev"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  lessons:
    output: true
    permalink: /:collection/:name/
  photos:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "lessons"
    values:
      layout: "lesson"
  - scope:
      path: ""
      type: "photos"
    values:
      layout: "photo"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # 後台與建置工具，不屬於網站內容
  - studio/
  - scripts/
  - package.json
  - package-lock.json
  - .env
  - .env.example
  - README.md
  - DEPLOY.md
  - ADMIN_GUIDE.md
  - ADOBE_FONTS_SETUP.md
  - PHOTO_CAROUSEL_GUIDE.md
  - PHOTO_UPLOAD_INSTRUCTIONS.md
  # 教案圖片已全部搬到 Sanity，改由 cdn.sanity.io 提供。
  # 這批檔案留在版控當備份，但不需要跟著部署（約 100MB）。
  - assets/images/lessons/ 